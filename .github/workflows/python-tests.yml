name: Python tooling checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run analyser tests
        run: python -m unittest discover -s tests -v
      - name: Validate example profile
        run: python tools/forge.py validate-profile profiles/example.json
      - name: Check CLI help
        run: python tools/forge.py --help
